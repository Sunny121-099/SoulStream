name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Patch Flutter internal Kotlin version
        run: |
          # Find and patch Flutter's internal gradle plugin kotlin version
          FLUTTER_GRADLE="$FLUTTER_ROOT/packages/flutter_tools/gradle"
          echo "Flutter SDK path: $FLUTTER_ROOT"
          
          if [ -f "$FLUTTER_GRADLE/build.gradle.kts" ]; then
            echo "Patching build.gradle.kts..."
            sed -i 's/kotlin("org.jetbrains.kotlin:kotlin-gradle-plugin").*/kotlin("org.jetbrains.kotlin:kotlin-gradle-plugin") version "1.8.22"/' "$FLUTTER_GRADLE/build.gradle.kts"
            cat "$FLUTTER_GRADLE/build.gradle.kts"
          elif [ -f "$FLUTTER_GRADLE/build.gradle" ]; then
            echo "Patching build.gradle..."
            sed -i 's/kotlin("org.jetbrains.kotlin:kotlin-gradle-plugin").*/kotlin("org.jetbrains.kotlin:kotlin-gradle-plugin") version "1.8.22"/' "$FLUTTER_GRADLE/build.gradle"
            cat "$FLUTTER_GRADLE/build.gradle"
          fi

      - run: flutter pub get

      - run: flutter build apk --debug
