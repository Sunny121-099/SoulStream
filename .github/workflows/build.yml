name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Debug Flutter gradle directory
        run: |
          echo "=== Flutter root: $FLUTTER_ROOT ==="
          find "$FLUTTER_ROOT/packages/flutter_tools/gradle" -type f 2>/dev/null | head -20
          echo "=== build.gradle.kts content ==="
          cat "$FLUTTER_ROOT/packages/flutter_tools/gradle/build.gradle.kts" 2>/dev/null || echo "Not found"
          echo "=== build.gradle content ==="
          cat "$FLUTTER_ROOT/packages/flutter_tools/gradle/build.gradle" 2>/dev/null || echo "Not found"

      - name: Patch Flutter internal Kotlin version
        run: |
          FILE="$FLUTTER_ROOT/packages/flutter_tools/gradle/build.gradle.kts"
          if [ -f "$FILE" ]; then
            echo "Patching build.gradle.kts..."
            sed -i 's/kotlin("org.jetbrains.kotlin:kotlin-gradle-plugin").*/kotlin("org.jetbrains.kotlin:kotlin-gradle-plugin") version "1.8.22"/' "$FILE"
            grep -n "kotlin-gradle-plugin" "$FILE"
          fi

      - run: flutter pub get

      - run: flutter build apk --debug
